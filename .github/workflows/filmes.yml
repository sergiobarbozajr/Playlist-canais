name: Lista de filmes de domínio público

on:
  workflow_dispatch:
  push:
    paths: ["scripts/gerar_filmes.py", ".github/workflows/filmes.yml"]
  schedule:
    - cron: "17 9 * * 1"   # toda segunda, 06:17 (Brasília)

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar a lista
        run: python3 scripts/gerar_filmes.py 600
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add filmes-dominio-publico.m3u8
          git diff --cached --quiet || (git commit -m "Atualiza lista de filmes de domínio público" && git push)
