name: Listas de filmes e séries de domínio público e logos de canais

on:
  workflow_dispatch:
  push:
    paths: ["scripts/gerar_*.py", "scripts/comum.py", "excluir.txt", ".github/workflows/filmes.yml"]
  schedule:
    - cron: "17 9 * * 1"   # toda segunda, 06:17 (Brasília)

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar a lista de filmes
        run: python3 scripts/gerar_filmes.py 600
      - name: Gerar a lista de séries
        run: python3 scripts/gerar_series.py 700
      - name: Gerar os logos de canais
        run: python3 scripts/gerar_logos.py
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898599+github-actions[bot]@users.noreply.github.com"
          git add filmes-dominio-publico.m3u8 series-dominio-publico.m3u8 logos.json
          git diff --cached --quiet || (git commit -m "Atualiza listas de domínio público e logos de canais" && git push)
